<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrowCtrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0622a"/>
    </marker>
    <marker id="arrowBus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a9c"/>
    </marker>
  </defs>

  <style>
    .blk { stroke-width:1.6; rx:8; }
    .blkTitle { font-size:14px; font-weight:700; text-anchor:middle; fill:#1a1a1a; }
    .blkSub { font-size:10px; text-anchor:middle; fill:#444; }
    .lbl { font-family: Consolas, Menlo, monospace; font-size:10.5px; fill:#1c3f73; paint-order:stroke; stroke:#ffffff; stroke-width:3; }
    .lblc { font-family: Consolas, Menlo, monospace; font-size:10.5px; fill:#94431a; paint-order:stroke; stroke:#ffffff; stroke-width:3; }
    .dataline { fill:none; stroke:#2c5aa0; stroke-width:1.8; marker-end:url(#arrowData); }
    .busline { fill:none; stroke:#4a4a9c; stroke-width:1.8; marker-end:url(#arrowBus); }
    .ctrlline { fill:none; stroke:#c0622a; stroke-width:1.6; stroke-dasharray:6,4; marker-end:url(#arrowCtrl); }
    .stub { fill:none; stroke:#4a4a9c; stroke-width:1.4; }
  </style>

  <rect x="0" y="0" width="1820" height="860" fill="#fbfbfd"/>

  <!-- Title -->
  <text x="910" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#111">32-bit RISC-V Processor — RV32I + Custom MUL/DIV</text>
  <text x="910" y="49" text-anchor="middle" font-size="12.5" fill="#555">Multi-cycle datapath &amp; FSM control architecture — derived from RISC-V-Processor/risc.v</text>

  <!-- ============ BLOCKS ============ -->

  <!-- PC -->
  <rect class="blk" x="60" y="140" width="150" height="80" fill="#eaf1fb" stroke="#2c5aa0"/>
  <text class="blkTitle" x="135" y="172">Program</text>
  <text class="blkTitle" x="135" y="188">Counter (PC)</text>
  <text class="blkSub" x="135" y="205">prgm_cntr — 32-bit</text>

  <!-- Instruction Memory -->
  <rect class="blk" x="280" y="140" width="180" height="80" fill="#eafaf0" stroke="#2e8b57"/>
  <text class="blkTitle" x="370" y="168">Instruction Memory</text>
  <text class="blkSub" x="370" y="184">instruction_mem</text>
  <text class="blkSub" x="370" y="198">64 x 32-bit, word addr.</text>

  <!-- Instruction Decoder -->
  <rect class="blk" x="540" y="130" width="190" height="100" fill="#f5eefc" stroke="#7b4fa6"/>
  <text class="blkTitle" x="635" y="158">Instruction Decoder</text>
  <text class="blkSub" x="635" y="174">instruction_dec</text>
  <text class="blkSub" x="635" y="188">opcode/func3/func7 →</text>
  <text class="blkSub" x="635" y="201">dec_aluop, RS1/RS2/RD</text>
  <text class="blkSub" x="635" y="214">addr, imm fields</text>

  <!-- Register File -->
  <rect class="blk" x="830" y="90" width="190" height="110" fill="#eaf1fb" stroke="#2c5aa0"/>
  <text class="blkTitle" x="925" y="120">Register File</text>
  <text class="blkSub" x="925" y="136">reg_file</text>
  <text class="blkSub" x="925" y="150">x0 (hardwired 0) .. x31</text>
  <text class="blkSub" x="925" y="164">async read / sync write</text>

  <!-- Immediate Generator -->
  <rect class="blk" x="540" y="300" width="190" height="110" fill="#f5eefc" stroke="#7b4fa6"/>
  <text class="blkTitle" x="635" y="330">Immediate Generator</text>
  <text class="blkSub" x="635" y="346">imm_gen</text>
  <text class="blkSub" x="635" y="362">immI, immS, immB,</text>
  <text class="blkSub" x="635" y="375">immJ, immU</text>

  <!-- WB Mux -->
  <rect class="blk" x="830" y="470" width="220" height="90" fill="#fff0f0" stroke="#a83232"/>
  <text class="blkTitle" x="940" y="495">Write-Back MUX</text>
  <text class="blkSub" x="940" y="511">(WBMUX, top-level WD reg)</text>
  <text class="blkSub" x="940" y="525">selects: pc / immU / pc+immU /</text>
  <text class="blkSub" x="940" y="538">ALUOUT / data_mem_out → WD</text>

  <!-- Controller -->
  <rect class="blk" x="60" y="470" width="420" height="260" fill="#fff6e5" stroke="#b5651d"/>
  <text class="blkTitle" x="270" y="496">Controller (FSM)</text>
  <text class="blkSub" x="270" y="512">controller — 7 states</text>
  <text x="90" y="534" font-size="10.5px" fill="#5a4325" font-family="Consolas, Menlo, monospace">fetch → decode → read_src_regs →</text>
  <text x="90" y="549" font-size="10.5px" fill="#5a4325" font-family="Consolas, Menlo, monospace">execute → rw_data_mem → write_back →</text>
  <text x="90" y="564" font-size="10.5px" fill="#5a4325" font-family="Consolas, Menlo, monospace">call_nxt_pc → (back to fetch)</text>
  <text x="90" y="588" font-size="10.5px" fill="#5a4325">Drives: ALUOP, IRMUX, PCMUX, BJ_sel,</text>
  <text x="90" y="602" font-size="10.5px" fill="#5a4325">WBMUX, WERF, MWR based on FSM state</text>
  <text x="90" y="616" font-size="10.5px" fill="#5a4325">+ instr[6:0] opcode + dec_aluop.</text>
  <text x="90" y="638" font-size="10.5px" fill="#5a4325">Consumes Branch_target (BT) from ALU</text>
  <text x="90" y="652" font-size="10.5px" fill="#5a4325">to resolve branch taken/not-taken in</text>
  <text x="90" y="666" font-size="10.5px" fill="#5a4325">the call_nxt_pc state.</text>
  <rect x="80" y="686" width="18" height="18" fill="#666"/>
  <text x="104" y="700" font-size="10.5px" fill="#333">clock, reset (sequential state reg)</text>

  <!-- Data Memory -->
  <rect class="blk" x="1560" y="140" width="180" height="100" fill="#eafaf0" stroke="#2e8b57"/>
  <text class="blkTitle" x="1650" y="168">Data Memory</text>
  <text class="blkSub" x="1650" y="184">data_mem</text>
  <text class="blkSub" x="1650" y="198">64 x 32-bit</text>
  <text class="blkSub" x="1650" y="212">MWR: 1=Read 0=Write</text>

  <!-- ALU outer -->
  <rect x="1080" y="60" width="380" height="430" rx="10" fill="#fbfbff" stroke="#333" stroke-width="1.8"/>
  <text x="1270" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#111">ALU</text>

  <!-- B-select -->
  <rect class="blk" x="1150" y="108" width="270" height="50" fill="#eef0fb" stroke="#4a4a9c"/>
  <text class="blkTitle" x="1285" y="128" font-size="12.5">Operand B Select — IRMUX</text>
  <text class="blkSub" x="1285" y="143">rs2 / immS / immI → B</text>

  <!-- CLA -->
  <rect class="blk" x="1150" y="192" width="270" height="42" fill="#eef0fb" stroke="#4a4a9c"/>
  <text class="blkTitle" x="1285" y="210" font-size="12">Carry-Look-Ahead Adder/Sub</text>
  <text class="blkSub" x="1285" y="224">ADD / SUB (cin selects)</text>

  <!-- Mult -->
  <rect class="blk" x="1150" y="247" width="270" height="42" fill="#eef0fb" stroke="#4a4a9c"/>
  <text class="blkTitle" x="1285" y="265" font-size="12">Booth's Multiplier — MUL *</text>
  <text class="blkSub" x="1285" y="279">64-bit product → HI / LO</text>

  <!-- Div -->
  <rect class="blk" x="1150" y="302" width="270" height="42" fill="#eef0fb" stroke="#4a4a9c"/>
  <text class="blkTitle" x="1285" y="320" font-size="12">Non-Restoring Divider — DIV *</text>
  <text class="blkSub" x="1285" y="334">Quotient Q / Remainder R</text>

  <!-- Logic -->
  <rect class="blk" x="1150" y="357" width="270" height="42" fill="#eef0fb" stroke="#4a4a9c"/>
  <text class="blkTitle" x="1285" y="375" font-size="12">Logic / Shift / Compare</text>
  <text class="blkSub" x="1285" y="389">AND OR XOR SLL SRL SRA SLT SLTU EQ</text>

  <!-- Result select -->
  <rect class="blk" x="1150" y="411" width="270" height="52" fill="#eef0fb" stroke="#4a4a9c"/>
  <text class="blkTitle" x="1285" y="431" font-size="12.5">Result Select (ALUOP)</text>
  <text class="blkSub" x="1285" y="446">→ ALUOUT, JT (Jump Target), BT (Branch Target = ALUOUT[0])</text>

  <text x="1150" y="500" font-size="9.5" fill="#666" font-style="italic">* MUL / DIV are custom R-type encodings (func7=0010000 / 0001000, func3=000) — not base RV32I</text>

  <!-- internal bus spines -->
  <line x1="1108" y1="150" x2="1108" y2="400" stroke="#4a4a9c" stroke-width="2"/>
  <line x1="1108" y1="212" x2="1150" y2="212" class="stub"/>
  <line x1="1108" y1="267" x2="1150" y2="267" class="stub"/>
  <line x1="1108" y1="322" x2="1150" y2="322" class="stub"/>
  <line x1="1108" y1="377" x2="1150" y2="377" class="stub"/>
  <text class="lbl" x="1015" y="230" transform="rotate(-90 1015 230)">A, B operands</text>

  <line x1="1132" y1="130" x2="1132" y2="463" stroke="#c0622a" stroke-width="1.6" stroke-dasharray="6,4"/>
  <line x1="1132" y1="130" x2="1150" y2="130" class="ctrlline"/>
  <line x1="1132" y1="435" x2="1150" y2="435" class="ctrlline"/>

  <!-- ============ DATA PATH LINES ============ -->

  <!-- PC -> IMEM -->
  <line x1="210" y1="180" x2="280" y2="180" class="dataline"/>
  <text class="lbl" x="216" y="174">pc[31:0]</text>

  <!-- IMEM -> IDEC -->
  <line x1="460" y1="180" x2="540" y2="180" class="dataline"/>
  <text class="lbl" x="466" y="174">instr[31:0]</text>

  <!-- IMEM -> Controller (opcode) -->
  <line x1="370" y1="220" x2="370" y2="470" class="dataline"/>
  <text class="lbl" x="376" y="380">instr[6:0]</text>
  <text class="lbl" x="376" y="394">(opcode)</text>

  <!-- IDEC -> RF -->
  <line x1="730" y1="160" x2="830" y2="160" class="dataline"/>
  <text class="lbl" x="735" y="154">RS1,RS2,RD addr[4:0]</text>

  <!-- IDEC -> IMMGEN -->
  <line x1="635" y1="230" x2="635" y2="300" class="dataline"/>
  <text class="lbl" x="641" y="268">imm_bus[11:0]</text>
  <text class="lbl" x="641" y="281">imm_bus_UJ[19:0]</text>

  <!-- IDEC -> Controller (dec_aluop) -->
  <polyline points="635,230 635,250 250,470" class="dataline" fill="none"/>
  <text class="lbl" x="430" y="368">dec_aluop[3:0]</text>

  <!-- RF rs1 -> ALU A -->
  <line x1="1020" y1="140" x2="1080" y2="140" class="dataline"/>
  <text class="lbl" x="1024" y="134">rs1 (A)</text>

  <!-- IMMGEN -> B-select (immS, immI) via bezier -->
  <path d="M730,330 Q900,380 1080,145 L1150,133" class="dataline"/>
  <text class="lbl" x="820" y="368">immS, immI</text>

  <!-- RF rs2 -> junction -->
  <line x1="1020" y1="180" x2="1070" y2="180" class="dataline"/>
  <!-- junction -> B-select -->
  <polyline points="1070,180 1070,132 1150,132" class="dataline" fill="none"/>
  <text class="lbl" x="1024" y="196">rs2</text>
  <!-- junction -> data memory (store data), routed below ALU -->
  <polyline points="1070,180 1070,580 1720,580 1720,240" class="dataline" fill="none"/>
  <text class="lbl" x="1400" y="574">rs2 (store data)</text>

  <!-- IMMGEN -> PC (immB, immJ) -->
  <polyline points="540,340 230,340 210,220" class="dataline" fill="none"/>
  <text class="lbl" x="280" y="334">immB, immJ</text>

  <!-- IMMGEN -> WBMUX (immU) -->
  <polyline points="650,410 650,440 900,440 900,470" class="dataline" fill="none"/>
  <text class="lbl" x="700" y="434">immU</text>

  <!-- ALU result -> exits: ALUOUT, JT, BT -->
  <!-- ALUOUT -> right side of ALU -> Data Memory (address) -->
  <polyline points="1300,463 1300,478 1410,478 1410,190 1560,190" class="dataline" fill="none"/>
  <text class="lbl" x="1420" y="472">ALUOUT (addr)</text>

  <!-- ALUOUT -> WBMUX -->
  <polyline points="1250,463 1250,510 1050,510" class="dataline" fill="none"/>
  <text class="lbl" x="1055" y="504">ALUOUT</text>

  <!-- JT -> PC -->
  <polyline points="1150,463 1150,437 650,460 210,220" class="dataline" fill="none"/>
  <text class="lbl" x="700" y="454">Jump_target (JT)</text>

  <!-- BT -> Controller -->
  <polyline points="1200,463 1200,410 400,470" class="dataline" fill="none"/>
  <text class="lbl" x="900" y="404">Branch_target (BT)</text>

  <!-- Data Memory -> WBMUX -->
  <polyline points="1650,240 1650,550 1050,550" class="dataline" fill="none"/>
  <text class="lbl" x="1400" y="544">data_mem_out</text>

  <!-- PC -> WBMUX (pc value) -->
  <polyline points="200,220 200,265 1000,265 1000,470" class="dataline" fill="none"/>
  <text class="lbl" x="500" y="259">pc</text>

  <!-- WBMUX -> RF (WD write_data), short vertical feedback -->
  <line x1="925" y1="470" x2="925" y2="200" class="dataline"/>
  <text class="lbl" x="931" y="340">WD (write_data)</text>

  <!-- ============ CONTROL SIGNAL LINES (dashed) ============ -->

  <!-- Controller -> PC -->
  <line x1="150" y1="470" x2="150" y2="220" class="ctrlline"/>
  <text class="lblc" x="105" y="360">PCMUX[1:0]</text>
  <text class="lblc" x="105" y="373">BJ_sel</text>

  <!-- Controller -> RF (WERF) -->
  <polyline points="450,470 450,255 950,255 950,200" class="ctrlline" fill="none"/>
  <text class="lblc" x="600" y="249">WERF</text>

  <!-- Controller -> ALU (ALUOP, IRMUX bundle) -->
  <polyline points="480,600 1132,600 1132,463" class="ctrlline" fill="none"/>
  <text class="lblc" x="700" y="594">ALUOP[3:0], IRMUX[1:0]</text>

  <!-- Controller -> Data Memory (MWR) -->
  <polyline points="480,650 1700,650 1700,240" class="ctrlline" fill="none"/>
  <text class="lblc" x="900" y="644">MWR</text>

  <!-- Controller -> WBMUX (WBMUX select) -->
  <line x1="480" y1="520" x2="830" y2="520" class="ctrlline"/>
  <text class="lblc" x="600" y="514">WBMUX[2:0]</text>

  <!-- clock/reset icons on sequential blocks -->
  <rect x="70" y="150" width="14" height="14" fill="#666"/>
  <text x="90" y="161" font-size="9.5" fill="#333">clk/rst</text>

  <rect x="840" y="100" width="14" height="14" fill="#666"/>
  <text x="860" y="111" font-size="9.5" fill="#333">clk/rst</text>

  <rect x="1570" y="150" width="14" height="14" fill="#666"/>
  <text x="1590" y="161" font-size="9.5" fill="#333">clk/rst</text>

  <rect x="550" y="140" width="14" height="14" fill="#666"/>
  <text x="570" y="151" font-size="9.5" fill="#333">clk (decode reg)</text>

  <!-- ============ LEGEND ============ -->
  <rect x="1520" y="600" width="260" height="150" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  <text x="1540" y="622" font-size="12.5" font-weight="700" fill="#111">Legend</text>

  <line x1="1540" y1="640" x2="1575" y2="640" class="dataline"/>
  <text x="1582" y="644" font-size="11" fill="#222">Data path</text>

  <line x1="1540" y1="662" x2="1575" y2="662" class="ctrlline"/>
  <text x="1582" y="666" font-size="11" fill="#222">Control signal (from FSM)</text>

  <line x1="1540" y1="684" x2="1575" y2="684" stroke="#4a4a9c" stroke-width="2"/>
  <text x="1582" y="688" font-size="11" fill="#222">Internal ALU operand bus</text>

  <rect x="1540" y="698" width="14" height="14" fill="#666"/>
  <text x="1582" y="710" font-size="11" fill="#222">Clock / Reset</text>

  <rect x="1535" y="722" width="16" height="16" fill="#fff6e5" stroke="#b5651d"/>
  <text x="1582" y="734" font-size="11" fill="#222">Control unit (FSM)</text>

  <text x="1540" y="748" font-size="9.5" fill="#666" font-style="italic">See README.md for full FSM state table</text>
</svg>
